<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>台新期貨登入驗收</title><style nonce="__NONCE__">body{max-width:760px;margin:36px auto;padding:20px;background:#101820;color:#e3eef5;font:16px/1.7 'Microsoft JhengHei',sans-serif}section{padding:24px;background:#182935;border:1px solid #345062;border-radius:16px}label{display:block;margin-top:15px}input,select{box-sizing:border-box;width:100%;padding:12px;background:#101820;color:white;border:1px solid #536c7c;border-radius:8px}button{margin:18px 8px 0 0;padding:12px 20px;border-radius:8px;border:0;background:#8bd7be;cursor:pointer}button:disabled{opacity:.4}small{color:#a1b8c6}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#101820;padding:16px;border-radius:8px}h1{font-size:26px}</style></head><body><h1>台新期貨 · 登入驗收</h1><p>本頁只測登入、交易連線與回補訊號。正式環境也是唯讀，不提供任何送單操作。</p><section><form id="form" autocomplete="off"><label for="environment">連線環境</label><select id="environment"><option value="validation">驗證環境</option><option value="formal">正式環境（唯讀登入，不送單）</option></select><label for="id">台新登入 ID</label><input id="id" autocomplete="off" maxlength="128"><label for="password">密碼</label><input id="password" type="password" autocomplete="new-password" maxlength="4096"><button id="login" disabled>唯讀登入</button></form><button id="reset" type="button">重建連線程序</button><p id="status" role="status">正在確認 32 位元程序……</p><small id="build"></small><pre id="result">所有環境均未提供委託操作。</pre></section><p><small>帳密僅傳給本機獨立期貨程序；不保存於檔案。登入成功不代表期貨策略已完成或可正式交易。</small></p><script nonce="__NONCE__">
const csrf="__CSRF__",el=id=>document.getElementById(id);let busy=false,connected=false,ready=false;
function controls(){el('environment').disabled=busy||connected;el('login').disabled=!ready||busy||connected;el('reset').disabled=busy}
async function state(){try{const r=await fetch('/api/state');const s=await r.json();ready=!!s.worker_ready&&s.worker_build==='futures-login-20261028-r2';connected=!!s.connected;el('build').textContent='連線程序：'+(s.worker_build||'未就緒');el('status').textContent=ready?'期貨程序已就緒，請輸入帳密唯讀登入。':(s.error||'程序未就緒')}catch(e){ready=false;el('status').textContent='無法連接本機服務。'}controls()}
async function call(action,data){const r=await fetch('/api/'+action,{method:'POST',headers:{'Content-Type':'application/json','X-Momentum-CSRF':csrf},body:JSON.stringify(data)});return await r.json()}
el('form').addEventListener('submit',async event=>{event.preventDefault();if(!el('id').value.trim()||!el('password').value){el('status').textContent='請輸入登入 ID 與密碼。';return}busy=true;controls();el('status').textContent='等待台新期貨登入與回補訊號……';const data={username:el('id').value.trim(),password:el('password').value,environment:el('environment').value};const pending=call('login',data);data.username='';data.password='';el('id').value='';el('password').value='';try{const r=await pending;connected=!!r.connected;el('status').textContent=r.ok?'期貨登入成功；仍未提供下單功能。':'登入未通過：'+(r.error||'UNKNOWN');el('result').textContent=JSON.stringify(r.diagnostics||{},null,2)}catch(e){connected=false;el('status').textContent='本機程序未回覆，請重建連線程序。'}finally{busy=false;controls()}});
el('reset').addEventListener('click',async()=>{busy=true;controls();try{await call('logout',{});connected=false;el('environment').disabled=false;await state();el('result').textContent='已清除顯示資料，連線程序已重建。'}catch(e){ready=false;el('status').textContent='重建失敗，請重新啟動期貨服務。'}finally{busy=false;controls()}});state();
</script></body></html>
