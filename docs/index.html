function simulate(v,g){const {c:C,i:I,q:Q,m:M,h:H}=v,R=Q*v.is*M;if(![C,I,Q,M,H,...margins(v,I)].every(Number.isFinite)||C<=0||I<=v.is||Q<1||Q>100||!Number.isInteger(Q)||M<=0||margins(v,I)[1]<=0||margins(v,I)[0]<margins(v,I)[1]||H<I||H-I>100000||!(v.tick>0)||!(v.increment>=v.tick)||![v.i,v.h,v.is,v.core,v.attack,v.atr,v.step,v.increment].every(x=>Number.isFinite(x)&&x>0)||v.core>=I||v.attack>=I|| (H-I)/v.increment>20000)return null;const D=v.atrMode?Math.max(v.tick,up(v.atr*({range:2,normal:2.5,strong:3.5}[v.market]),v.tick)):v.core,A=v.atrMode?Math.max(v.tick,up(v.atr*2,v.tick)):v.attack;let bs=[{name:'核心倉',e:I,q:Q,s:down(I-v.is,v.tick)}],real=0,used=0,last=I,serial=0,water=C,rows=[],done=new Set();const portions={range:[[1,.4],[2,.4]],normal:[[1,.2],[2,.2],[3,.2]],strong:[[2,.2],[3,.2]]}[v.market];const stats=(p,b=bs)=>{const q=b.reduce((a,x)=>a+x.q,0),f=b.reduce((a,x)=>a+(p-x.e)*x.q*M,0),e=C+real+f,lock=real+b.reduce((a,x)=>a+((x.s-x.e)*M-v.fee)*x.q,0);const [imUnit,mmUnit]=margins(v,p);return {imUnit,mmUnit,q,f,e,profit:real+f,lock,l:q*p*M/e,mm:q?e/(q*mmUnit)*100:0,im:q*imUnit/e*100,gap:q*(p*M*.05+v.fee)/e*100,risk:b.reduce((a,x)=>a+x.q*(Math.max(0,(x.e-x.s)*M)+v.fee),0),real}};const init=stats(I);function row(p,action,delta){rows.push({...stats(p),p,action,delta,cs:bs[0].s,as:bs.length>1?bs.at(-1).s:null})}row(I,'初始進場',Q);function gate(p){const s=stats(p),b={name:'加碼'+(serial+1),e:p,q:v.add,s:down(p-A,v.tick)},n=stats(p,[...bs,b]),risk=v.add*(A*M+v.fee),r=(water-C)/R,ratio=v.dynamic?retention(r):v.keep,floor=v.dynamic&&r<1?-Infinity:Math.max(0,(water-C)*ratio/100),fail=[];if(v.mode==='adaptive'&&v.market!=='strong')fail.push('市場狀態');if(p-last+1e-8<v.step)fail.push('加碼間距');if(s.profit<=0||n.e<=0)fail.push('尚無獲利或權益不足');if(g.lev&&n.l>(v.strict?Math.min(v.lev,3.5):v.lev))fail.push('槓桿');if(g.keep&&n.lock<floor)fail.push('獲利保護');if(g.margin&&n.im>v.margin)fail.push('保證金');if(g.maint&&n.mm<v.maint)fail.push('維持率');if(g.stress&&(n.gap>v.stress||n.e*(1-n.gap/100)<n.q*n.mmUnit))fail.push('跳空壓力');if(g.reuse&&used+risk>Math.max(0,water-C)*v.reuse/100)fail.push('浮盈預算');if(g.dd&&(water-C-n.lock)/water*100>v.dd)fail.push('回撤');if(g.maxq&&n.q>v.maxq)fail.push('口數上限');if(v.strict&&(init.risk>C*.01||n.risk>n.e*.015))fail.push('完整R風控（簡化）');if(n.q>500||b.s<=0)fail.push('模擬上限');return{b,fail,risk}}
for(let x=I;x<H;){const prev=x;x=Math.min(H,roundPrice(x+v.increment)); // Include exact R target when between 50-point steps, to avoid inconsistent timestamps.

for(const b of bs)b.s=Math.max(b.s,down(x-(b.name==='核心倉'?D:A),v.tick));water=Math.max(water,stats(x).e);let took=false;if(v.mode==='adaptive')for(const [r,f] of portions){if(x>=up(I+r*v.is,v.tick)&&!done.has(r)){done.add(r);const b=bs[0],n=Math.max(0,Math.min(b.q-1,Math.floor(Q*f)));if(n){real+=n*((up(I+r*v.is,v.tick)-I)*M-v.fee);b.q-=n;row(x,'+'+r+'R 停利',-n);took=true}}}const g0=gate(x);if(!took&&g0.fail.length===0){bs.push(g0.b);serial++;used+=g0.risk;last=x;row(x,'浮盈加碼',v.add)}else if(!took&&(v.detail||Math.abs((x-I)/(v.increment*10)-Math.round((x-I)/(v.increment*10)))<1e-7||x===H))row(x,'移動停損',0)}const end=stats(H);water=Math.max(water,end.e);let rem=end.q,exReal=real;const exits=[...new Set(bs.map(b=>b.s))].sort((a,b)=>b-a).map(p=>{const closing=bs.filter(b=>b.s===p),n=closing.reduce((a,b)=>a+b.q,0);exReal+=closing.reduce((a,b)=>a+((p-b.e)*M-v.fee)*b.q,0);rem-=n;const left=bs.filter(b=>b.s<p),e=C+exReal+left.reduce((a,b)=>a+(p-b.e)*b.q*M,0);return{p,n,remain:rem,e,real:exReal,l:rem*p*M/e,mm:rem?e/(rem*margins(v,p)[1])*100:0,names:closing.map(b=>b.name).join('、'),cs:left.find(b=>b.name==='核心倉')?.s??null,as:left.filter(b=>b.name!=='核心倉').at(-1)?.s??null}});return {bs,rows,end,exits,rr:real,used,water,init,reason:gate(H).fail,ratio:v.dynamic?retention((water-C)/R):v.keep,R,D,A}}
const $=id=>document.getElementById(id),fmt=x=>Number.isFinite(x)?Number(x.toFixed(8)).toLocaleString('en-US',{maximumFractionDigits:8}):'—',dec=x=>Number.isFinite(x)?x.toFixed(2):'—';function refresh(){render();}function num(k,t){return `<label>${t}<input type="number" step="any" data-k="${k}" value="${v[k]}"></label>`}function range(k,t,min,max,step,u=''){return `<label>${t} <b id="val_${k}">${v[k]}${u}</b><input type="range" data-k="${k}" data-unit="${u}" min="${min}" max="${max}" step="${step}" value="${v[k]}"></label>`}function cb(k,t){return `<label><input type="checkbox" data-k="${k}" ${v[k]?'checked':''}> ${t}</label>`}function select(k,t,opts){return `<label>${t}<select data-k="${k}">${opts.map(([a,b])=>`<option value="${a}" ${v[k]===a?'selected':''}>${b}</option>`).join('')}</select></label>`}function setup(){const z=scale(v.i,v.tick); $('modes').innerHTML=select('mode','策略',[['adaptive','原始自適應：R分批停利＋趨勢倉＋浮盈加碼'],['pyramid','群聯式：浮盈加碼＋移動停損']])+select('market','市場狀態',[['range','震盪盤'],['normal','一般趨勢'],['strong','強勢趨勢']]);$('base').innerHTML=select('product','交易商品（官方公告快照）',Object.entries(products).map(([k,a])=>[k,a[0]+' '+k]))+select('marginType','保證金模式',[['fixed','固定金額'],['ratio','契約價值比例']])+[['c','初始本金'],['i','進場價格'],['q','初始口數'],['m','每點價值'],...(v.marginType==='fixed'?[['im','每口原始保證金'],['mm','每口維持保證金']]:[])].map(a=>num(...a)).join('')+num('tick','最小跳動單位（請核對契約）')+num('increment','模擬檢查價格間距')+(v.marginType==='ratio'?select('tier','官方級距（須核對個別商品）',[['1','級距1'],['2','級距2'],['3','級距3'],['custom','自訂比例']])+num('ir','原始比例 %')+num('mr','維持比例 %'):'')+priceRange('is','初始停損距離',v.tick,z.max,v.tick);$('target').innerHTML=priceRange('h','最高價',v.i,Math.max(v.i*2,v.h,v.i+v.tick),v.tick);$('quick').innerHTML=z.quick.map(n=>`<button data-rise="${n}">${fmt(roundPrice(v.i+n))}</button>`).join(' ');$('switches').innerHTML=cb('dynamic','動態R值獲利保護')+cb('atrMode','ATR倍數移動停損');$('stops').innerHTML=(v.atrMode?priceRange('atr','手動ATR',v.tick,z.max,v.tick):priceRange('core','核心倉移動停損',v.ti function table(head,rows){return `<div class="scroll"><table><thead><tr>${head.map(t=>`<th>${t}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(t=>`<td>${t}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}function metrics(a){return `<div class="grid">${a.map(([t,x])=>`<div class="metric"><small>${t}</small><b>${x}</b></div>`).join('')}</div>`}function action(r){return r.delta>0?`<span class="plus">+${r.delta}口 ${r.action}</span>`:r.delta<0?`<span class="minus">${r.delta}口 ${r.action}</span>`:r.action}
function entryCheck(v,g){const {c:C,i:P,q:Q,m:M,fee:B,tick:T}=v,[IM,MM]=margins(v,P),S=down(P-v.is,T),unit=(P-S)*M+B,stressUnit=P*M*.05+B;if(![C,P,Q,M,B,T,IM,MM,S,unit,v.entryRisk,v.lev,v.margin,v.maint,v.stress,v.maxq].every(Number.isFinite)||C<=0||P<=0||M<=0||Q<1||!Number.isInteger(Q)||T<=0||S<=0||S>=P||B<0||IM<MM||MM<=0||v.entryRisk<=0)return null;const items=[];function add(name,actual,limit,on,capacity,capital,greater=false,unitLabel='%'){const bad=greater?actual<limit-1e-8:actual>limit+1e-8;items.push({name,actual,limit,on,bad,capacity:Math.max(0,Math.floor(capacity+1e-9)),capital:Math.ceil(capital-1e-9),greater,unitLabel})}const riskPct=v.strict?1:v.entryRisk;add('初始停損風險',Q*unit/C*100,riskPct,v.strict||v.entryRiskEnabled,C*riskPct/100/unit,Q*unit/(riskPct/100));add('原始保證金（基本資金）',Q*IM/C*100,100,true,C/IM,Q*IM);add('原始保證金占用',Q*IM/C*100,v.margin,g.margin,C*v.margin/100/IM,Q*IM/(v.margin/100));add('維持率',C/(Q*MM)*100,v.maint,g.maint,C/(MM*v.maint/100),Q*MM*v.maint/100,true);const lev=v.strict?Math.min(v.lev,3.5):v.lev;add('名目槓桿',Q*P*M/C,lev,g.lev,C*lev/(P*M),Q*P*M/lev,false,'倍');add('5%跳空壓力損失',Q*stressUnit/C*100,v.stress,g.stress,C*v.stress/100/stressUnit,Q*stressUnit/(v.stress/100));add('跳空後維持保證金覆蓋', (C-Q*stressUnit)/(Q*MM)*100,100,g.stress,C/(stressUnit+MM),Q*(stressUnit+MM),true);add('最大總口數',Q,v.maxq,g.maxq,v.maxq,0,false,'口');const active=items.filter(x=>x.on),max=Math.min(...active.map(x=>x.capacity)),capital=Math.max(...active.map(x=>x.capital)),maxDistance=down((C*riskPct/100/Q-B)/M,T);return {items,max,capital,maxDistance,unit,S,riskPct,bad:active.filter(x=>x.bad),qtyBlocked:g.maxq&&Q>v.maxq}}
function renderEntry(){const x=entryCheck(v,enabled),el=$('risk');if(!x){el.innerHTML='<p class="minus">初始參數無效，請先確認價格、口數、保證金及停損。</p>';return}const money=n=>fmt(Math.max(0,n))+' 元';const riskInput=`<label>初始風險研究目標（占本金 %）<input type="number" min="0.01" max="100" step="0.1" data-k="entryRisk" value="${v.entryRisk}" ${v.strict?'disabled':''}></label>`;el.innerHTML=`<div class="riskhead"><h2>初始交易風險健檢</h2>${riskInput}<label><input type="checkbox" data-k="entryRiskEnabled" ${v.entryRiskEnabled?'checked':''} ${v.strict?'disabled':''}> 將初始風險納入口數與本金門檻（預設關閉）</label><p>原策略進場風險標準為 1%；研究目標可自行修改，嚴格模式固定 1% 並強制納入門檻。關閉時仍顯示超標警示，但不計入綜合建議。此面板只診斷，不會自動改變策略或下單。固定初始R（不含成本）：${fmt(v.q*v.is*v.m)} 元；實際模擬停損 ${fmt(x.S)}；含緩衝每口風險 ${fmt(x.unit)} 元。</p><div class="riskresult ${x.bad.length?'bad':''}"><h3>${x.bad.length?'⚠ '+x.bad.length+' 項啟用條件超標':'✓ 符合目前啟用的研究門檻'}</h3><p>同時符合所有啟用條件的最多口數：<b>${x.max} 口</b>。${x.max<v.q?'至少減少 '+(v.q-x.max)+' 口。':''} ${x.max===0?'目前連一口也未符合全部門檻。':''}</p><p>維持 ${v.q} 口、停損及其他設定不變：${x.qtyBlocked?'仍須調整總口數上限；資金條件另需至少 ': '所需本金至少 ' }<b>${money(x.capital)}</b>，${x.capital>v.c?'至少增加 '+money(x.capital-v.c):'無須增加本金'}。</p><p>依初始風險目標試算（關閉時僅供參考）：${x.maxDistance>=v.tick?'停損距離最多 '+fmt(x.maxDistance)+' 點；'+(v.is>x.maxDistance?'至少縮短 '+fmt(v.is-x.maxDistance)+' 點。':'目前距離符合。'):'即使使用最小跳動距離仍不足，需減口或增加資金。'} 縮短停損不能解決槓桿或保證金超標，也可能不符合技術結構。</p></div><div class="riskgrid">${x.items.map(a=>`<div class="riskitem ${a.bad?'bad':!a.on?'off':''}"><span class="status">${!a.on?(a.bad?'⚠ 超標（僅警示，不計入限制）':'僅參考（符合目標）'):a.bad?'⚠ 超標':'✓ 符合'}</span><p>${a.name}</p><strong>${dec(a.actual)}${a.unitLabel}</strong><p>門檻 ${a.greater?'≥':'≤'} ${a.limit}${a.unitLabel}${a.bad?'；差距 '+dec(Math.abs(a.actual-a.limit))+(a.unitLabel==='%'?' 個百分點':a.unitLabel):''}</p><p>${a.on?'此項最多':'依參考目標最多'} ${a.capacity} 口${a.bad?'；至少減 '+Math.max(0,v.q-a.capacity)+' 口':''}。</p>${a.capital>0?`<p>維持口數所需本金 ${money(a.capital)}${a.capital>v.c?'（增加 '+money(a.capital-v.c)+'）':''}</p>`:''}</div>`).join('')}</div><p>加碼預算、浮盈保留及高點回撤屬進場後管理，不作初始倉位門檻。跳空後維持率以進場保證金作靜態壓力估算，非券商實際追繳公式。</p></div>`}
function render(){const r=lastResult=simulate(v,enabled);$('high').textContent=fmt(v.h);const [mi,mm]=margins(v,v.i);$('marginSource').innerHTML=`<p>期交所公告快照（查詢 2026-11-22；股票級距表更新 2026-11-17、ETF 2026-11-02）。非即時報價，券商可能加收。<a href="https://www.taifex.com.tw/cht/5/indexMargingDetail">指數類</a> ｜ <a href="https://www.taifex.com.tw/cht/5/stockMarginingDetail">股票及ETF類</a>。股票級距請自行核對個別商品；手動修改數值不代表官方標準。</p>${metrics([['進場每口原始',fmt(mi)],['進場每口維持',fmt(mm)],['總原始保證金',fmt(mi*v.q)],['總維持保證金',fmt(mm*v.q)]])}`;renderEntry();for(const k of keys){const el=document.querySelector(`input[data-k="${k}"]`);if(el)el.disabled=!enabled[k]||(k==='keep'&&v.dynamic)}if(!r){$('output').innerHTML='<section class="warn">請輸入有效參數。</section>';return}const {end,water,rows,exits,bs}=r,final=v.c+end.lock;const warning=r.init.risk>v.c*.01||r.init.im>v.margin||r.init.l>v.lev||r.init.gap>v.stress?`<p class="warn">初始風險 ${dec(r.init.risk/v.c*100)}%，初始部位可能不符合限制，僅依指定倉位模擬。</p>`:'';$('output').innerHTML=`<section><h2>⑤ 交易結果</h2>${warning}${metrics([['最高帳戶權益',fmt(water)],['累積獲利R',dec((water-v.c)/r.R)+'R'],['已實現損益',fmt(r.rr)],['未實現損益',fmt(end.f)],['剩餘口數',end.q+'口'],['實際槓桿',dec(end.l)+'倍'],['目前維持率',fmt(end.mm)+'%'],['目前要求獲利保留',enabled.keep?r.ratio+'%':'不限'],['原始保證金占用',dec(end.im)+'%'],['目前每口原始',fmt(end.imUnit)],['目前每口維持',fmt(end.mmUnit)],['5%跳空損失',dec(end.gap)+'%']])}<p>再次加碼限制：${r.reason.join('、')||'通過已啟用條件'}｜核心距離 ${r.D}點｜攻擊距離 ${r.A}點</p></section><section><h2>⑥ 完整交易指令表</h2>${cb('detail','顯示每次檢查紀錄')}${table(['點位','操作指令','剩餘口數','核心停損','加碼停損'],[...rows.map(a=>[fmt(a.p),action(a),a.q,fmt(a.cs),a.as==null?'—':fmt(a.as)]),['—','假設見頂後反轉','—','—','—'],...exits.map(a=>[fmt(a.p),`<span class="minus">−${a.n}口 ${a.remain?'減碼':'全數離場'}</span>`,a.remain,a.cs==null?'—':fmt(a.cs),a.as==null?'—':fmt(a.as)])])}<h2 style="margin-top:20px">各階段權益與槓桿</h2>${table(['點位','操作','權益（萬）','槓桿','維持率','每口原始','每口維持','保護獲利（萬）'],rows.map(a=>[fmt(a.p),action(a),dec(a.e/10000),dec(a.l),fmt(a.mm)+'%',fmt(a.imUnit),fmt(a.mmUnit),dec(a.lock/10000)]))}</section><section><h2>⑦ 見頂時各批次獨立停損</h2>${table(['部位','口數','成本','停損','保護損益'],[...bs.map(b=>[b.name,b.q,fmt(b.e),fmt(b.s),fmt(((b.s-b.e)*v.m-v.fee)*b.q)]),['已實現','—','—','—',fmt(r.rr)],['合計',end.q,'—','—',fmt(end.lock)]])}<h2 style="margin-top:20px">反轉離場明細</h2>${table(['點位','動作','剩餘口數','權益','槓桿','維持率'],exits.map(a=>[fmt(a.p),`<span class="minus">−${a.n}口 ${a.remain?'減碼':'全數離場'}</span>`,a.remain,fmt(a.e),dec(a.l),a.remain?fmt(a.mm)+'%':'—']))}</section><section><h2>⑧ 手動測試反轉行情</h2>${range('drop','從最高價回跌',0,Math.min(v.h-v.tick,Math.max(v.i*.15,r.D+v.tick,r.A+v.tick)),v.tick,'')}<div id="live"></div></section><section><h2>⑨ 全部出場結果</h2><div class="big minus">${fmt(exits.at(-1).p)} 點全數離場</div>${metrics([['最終帳戶權益',fmt(final)],['最終淨獲利',fmt(end.lock)],['本金報酬率',dec(end.lock/v.c*100)+'%'],['見頂至離場回撤',dec((water-final)/water*100)+'%'],['最高獲利保留率',water>v.c?dec(end.lock/(water-v.c)*100)+'%':'—']])}</section>`;live()}
function live(){const r=lastResult;if(!r)return;const p=Math.max(v.tick,roundPrice(v.h-v.drop)),q=r.bs.reduce((a,b)=>a+(p>b.s?b.q:0),0),e=v.c+r.rr+r.bs.reduce((a,b)=>a+((Math.max(p,b.s)-b.e)*v.m-(p<=b.s?v.fee:0))*b.q,0);$('live').innerHTML=metrics([['反轉價格',fmt(p)],['剩餘口數',q+'口'],['目前帳戶權益',fmt(e)],['目前權益回撤',dec((r.water-e)/r.water*100)+'%']])}
if(typeof document!=='undefined'){function handle(e){let el=e.target;if(e.type==='input'&&el.type==='number')return;if(e.type==='change'&&el.type!=='number')return;let k=el.dataset.k;if(el.dataset.g){enabled[el.dataset.g]=el.checked;render();return}if(!k)return;v[k]=el.type==='checkbox'?el.checked:el.tagName==='SELECT'?el.value:Number(el.value);if(k==='product'){const a=products[v.product];v.m=a[1];if(v.product!=='custom'){const seed=['TX','MTX','TMF'].includes(v.product)?36000:indexProducts.includes(v.product)?1000:50;resetScale(seed,tickFor(v.product));}v.marginType=['stock','mini'].includes(v.product)?'ratio':'fixed';if(v.marginType==='ratio'){v.ir=a[2];v.mr=a[3];v.tier='1'}else{v.im=a[2];v.mm=a[3]}setup();return}if(k==='tier'){const a={1:[13.5,10.35],2:[16.2,12.42],3:[20.25,15.53]}[v.tier];if(a)[v.ir,v.mr]=a;setup();return}if(k==='marginType'){setup();return}if(k==='i'||k==='tick'){if(el.value===''||!(v.i>v.tick&&v.tick>0))return;resetScale(v.i,v.tick);setup();return}if(['h','is','core','attack','atr','step','increment'].includes(k)){v[k]=Math.max(v.tick,up(v[k],v.tick));if(k==='h'){v.h=Math.max(v.i,v.h);v.drop=0;}document.querySelectorAll(`input[data-k="${k}"]`).forEach(a=>{if(a!==el)a.value=v[k]});if(el.type==='number'){setup();return}}if($('val_'+k))$('val_'+k).textContent=v[k]+(el.dataset.unit||'');if(k==='drop'){live();return}if(k==='atrMode'||k==='dynamic'||k==='strict')setup();else render()}document.addEventListener('input',handle);document.addEventListener('change',handle);document.addEventListener('click',e=>{if(e.target.dataset.rise!==undefined){v.h=roundPrice(v.i+Number(e.target.dataset.rise));v.drop=0;setup()}});$('reset').onclick=()=>{v={...defaults};enabled=Object.fromEntries(keys.map(k=>[k,true]));setup()};$('csv').onclick=()=>{if(!lastResult)return;const r=lastResult,lines=[['階段','點位','動作','口數變動','剩餘口數','核心停損','加碼停損','權益','槓桿','維持率','保護獲利'],...r.rows.map(a=>['上漲',a.p,a.action,a.delta,a.q,a.cs,a.as??'',a.e,a.l,a.mm,a.lock]),...r.exits.map(a=>['反轉',a.p,a.remain?'減碼':'全數離場',-a.n,a.remain,a.cs??'',a.as??'',a.e,a.l,a.mm,''])];const blob=new Blob(['\ufeff'+lines.map(a=>a.join(',')).join('\n')],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='波段作戰表.csv';a.click();URL.revokeObjectURL(url)};setup()}
</script></html>
